<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLU BLOCKS — August Blu</title>
<style>
@font-face {
  font-family: 'PressStart';
  src: local('Press Start 2P');
}
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root {
  --royal: #0F1A72;
  --royal-deep: #0A1150;
  --royal-black: #060A33;
  --ice: #D8E0FF;
  --electric: #2645E8;
  --electric-dim: #1B33B0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--royal-black);
  font-family: 'Press Start 2P', monospace;
  color: var(--ice);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

.wrap {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px;
  background:
    radial-gradient(ellipse at 50% -20%, rgba(38,69,232,0.25), transparent 60%),
    var(--royal-black);
}

.title {
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--ice);
  text-shadow: 0 3px 0 var(--electric-dim), 0 0 18px rgba(38,69,232,0.7);
}
.title .dot { color: var(--electric); }

.game-area {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.panel {
  background: var(--royal-deep);
  border: 3px solid var(--ice);
  box-shadow: 0 0 0 3px var(--royal-black), 0 0 0 6px var(--electric-dim), 6px 6px 0 6px rgba(0,0,0,0.5);
  image-rendering: pixelated;
}

.side {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 108px;
}

.side .panel {
  padding: 8px;
}

.label {
  font-size: 7px;
  color: var(--electric);
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.value {
  font-size: 10px;
  color: var(--ice);
  word-break: break-all;
  line-height: 1.5;
}

canvas { display: block; image-rendering: pixelated; }

#board { background: var(--royal-deep); }

.overlay {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: rgba(6,10,51,0.88);
  text-align: center;
  padding: 14px;
}
.overlay.show { display: flex; }
.overlay .big {
  font-size: 13px;
  line-height: 1.8;
  color: var(--ice);
  text-shadow: 0 0 14px rgba(38,69,232,0.9);
}
.overlay .small {
  font-size: 7px;
  line-height: 1.9;
  color: var(--electric);
}
.overlay .blink { animation: blink 1s steps(2) infinite; font-size: 8px; color: var(--ice); }
@keyframes blink { 50% { opacity: 0; } }

.board-holder { position: relative; }

.controls {
  display: none;
  gap: 8px;
  margin-top: 4px;
}
.controls .col { display: flex; flex-direction: column; gap: 8px; }
.controls .row { display: flex; gap: 8px; }
.btn {
  width: 52px;
  height: 52px;
  background: var(--royal-deep);
  border: 3px solid var(--ice);
  box-shadow: 0 4px 0 var(--electric-dim);
  color: var(--ice);
  font-family: inherit;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--electric-dim); }
.btn.wide { width: 112px; font-size: 8px; }

.credit {
  font-size: 6px;
  color: rgba(216,224,255,0.45);
  letter-spacing: 1px;
}
.credit a { color: var(--electric); text-decoration: none; }

@media (pointer: coarse), (max-width: 700px) {
  .controls { display: flex; }
  .title { font-size: 11px; }
}
@media (max-width: 430px) {
  .side { width: 84px; }
  .value { font-size: 8px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">BLU<span class="dot">■</span>BLOCKS</div>

  <div class="game-area">
    <div class="side">
      <div class="panel">
        <div class="label">SCORE</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="panel">
        <div class="label">TOP</div>
        <div class="value" id="top">0</div>
      </div>
      <div class="panel">
        <div class="label">LEVEL</div>
        <div class="value" id="level">1</div>
      </div>
      <div class="panel">
        <div class="label">LINES</div>
        <div class="value" id="lines">0</div>
      </div>
    </div>

    <div class="board-holder">
      <canvas id="board" class="panel"></canvas>
      <div class="overlay show" id="overlay">
        <div class="big" id="ovTitle">BLU BLOCKS</div>
        <div class="small" id="ovBody">ARROWS MOVE<br>UP ROTATE<br>SPACE DROP<br>C HOLD &nbsp; P PAUSE</div>
        <div class="blink" id="ovAction">PRESS START / TAP</div>
      </div>
    </div>

    <div class="side">
      <div class="panel">
        <div class="label">NEXT</div>
        <canvas id="next" width="80" height="200"></canvas>
      </div>
      <div class="panel">
        <div class="label">HOLD</div>
        <canvas id="hold" width="80" height="64"></canvas>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="col">
      <div class="row">
        <button class="btn" id="cLeft">◀</button>
        <button class="btn" id="cDown">▼</button>
        <button class="btn" id="cRight">▶</button>
      </div>
      <div class="row">
        <button class="btn" id="cRot">↻</button>
        <button class="btn" id="cHold" style="font-size:9px">HOLD</button>
        <button class="btn" id="cDrop" style="font-size:9px">DROP</button>
      </div>
    </div>
  </div>

  <div class="credit">AUGUSTBLU.COM</div>
</div>

<script>
(function () {
  var COLS = 10, ROWS = 20, CELL = 24;

  var boardCv = document.getElementById('board');
  var nextCv = document.getElementById('next');
  var holdCv = document.getElementById('hold');
  var bctx = boardCv.getContext('2d');
  var nctx = nextCv.getContext('2d');
  var hctx = holdCv.getContext('2d');

  function sizeBoard() {
    var maxH = window.innerHeight - 170;
    var maxW = window.innerWidth - 260;
    if (window.innerWidth <= 700) { maxH = window.innerHeight - 300; maxW = window.innerWidth - 200; }
    CELL = Math.max(14, Math.min(26, Math.floor(Math.min(maxH / ROWS, maxW / COLS))));
    boardCv.width = COLS * CELL;
    boardCv.height = ROWS * CELL;
  }
  sizeBoard();
  window.addEventListener('resize', function () { sizeBoard(); draw(); });

  var COLORS = {
    I: '#7FD8FF', O: '#FFD24A', T: '#B48CFF',
    S: '#5EEBA8', Z: '#FF6B8A', J: '#2645E8', L: '#FF9E4A'
  };

  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };

  var grid, cur, hold, canHold, bag, queue;
  var score, topScore = 0, level, lines;
  var dropTimer = 0, dropInterval, lastTime = 0;
  var state = 'title'; // title | play | pause | over
  var clearing = null;

  function newBag() {
    var b = ['I','O','T','S','Z','J','L'];
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = b[i]; b[i] = b[j]; b[j] = t;
    }
    return b;
  }

  function nextType() {
    if (bag.length === 0) bag = newBag();
    return bag.shift();
  }

  function spawn() {
    var type = queue.shift();
    queue.push(nextType());
    cur = {
      type: type,
      cells: SHAPES[type].map(function (c) { return [c[0], c[1]]; }),
      x: 3, y: -1
    };
    if (type === 'O') cur.x = 3;
    canHold = true;
    if (collides(cur.cells, cur.x, cur.y)) {
      state = 'over';
      if (score > topScore) topScore = score;
      showOverlay('GAME OVER', 'SCORE ' + score + '<br>TOP ' + topScore, 'PRESS START / TAP');
    }
  }

  function collides(cells, x, y) {
    for (var i = 0; i < cells.length; i++) {
      var cx = cells[i][0] + x, cy = cells[i][1] + y;
      if (cx < 0 || cx >= COLS || cy >= ROWS) return true;
      if (cy >= 0 && grid[cy][cx]) return true;
    }
    return false;
  }

  function rotate() {
    if (cur.type === 'O') return;
    var pivot = cur.type === 'I' ? 1.5 : 1;
    var rotated = cur.cells.map(function (c) {
      var rx = pivot + (c[1] - pivot);
      var ry = pivot - (c[0] - pivot);
      return [Math.round(rx), Math.round(ry)];
    });
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k < kicks.length; k++) {
      if (!collides(rotated, cur.x + kicks[k], cur.y)) {
        cur.cells = rotated;
        cur.x += kicks[k];
        return;
      }
    }
  }

  function move(dx) {
    if (!collides(cur.cells, cur.x + dx, cur.y)) cur.x += dx;
  }

  function softDrop() {
    if (!collides(cur.cells, cur.x, cur.y + 1)) {
      cur.y++;
      score += 1;
    } else {
      lock();
    }
  }

  function hardDrop() {
    var d = 0;
    while (!collides(cur.cells, cur.x, cur.y + 1)) { cur.y++; d++; }
    score += d * 2;
    lock();
  }

  function ghostY() {
    var y = cur.y;
    while (!collides(cur.cells, cur.x, y + 1)) y++;
    return y;
  }

  function doHold() {
    if (!canHold) return;
    canHold = false;
    var t = cur.type;
    if (hold) {
      queue.unshift(hold);
    }
    hold = t;
    spawn();
  }

  function lock() {
    for (var i = 0; i < cur.cells.length; i++) {
      var cx = cur.cells[i][0] + cur.x, cy = cur.cells[i][1] + cur.y;
      if (cy >= 0) grid[cy][cx] = cur.type;
    }
    var full = [];
    for (var r = 0; r < ROWS; r++) {
      var f = true;
      for (var c = 0; c < COLS; c++) if (!grid[r][c]) { f = false; break; }
      if (f) full.push(r);
    }
    if (full.length) {
      clearing = { rows: full, t: 0 };
    } else {
      spawn();
    }
  }

  function finishClear() {
    var rows = clearing.rows;
    for (var i = 0; i < rows.length; i++) {
      grid.splice(rows[i], 1);
      grid.unshift(new Array(COLS).fill(null));
    }
    var pts = [0, 100, 300, 500, 800][rows.length] * level;
    score += pts;
    lines += rows.length;
    var newLevel = Math.floor(lines / 10) + 1;
    if (newLevel !== level) {
      level = newLevel;
      dropInterval = Math.max(70, 800 - (level - 1) * 65);
    }
    clearing = null;
    spawn();
  }

  function reset() {
    grid = [];
    for (var r = 0; r < ROWS; r++) grid.push(new Array(COLS).fill(null));
    bag = newBag();
    queue = [nextType(), nextType(), nextType()];
    hold = null;
    score = 0; level = 1; lines = 0;
    dropInterval = 800;
    dropTimer = 0;
    clearing = null;
    spawn();
  }

  function drawCell(ctx, x, y, size, color, ghost) {
    var px = x * size, py = y * size;
    if (ghost) {
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.35;
      ctx.strokeRect(px + 2, py + 2, size - 4, size - 4);
      ctx.globalAlpha = 1;
      return;
    }
    ctx.fillStyle = color;
    ctx.fillRect(px, py, size, size);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(px, py, size, 3);
    ctx.fillRect(px, py, 3, size);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(px, py + size - 3, size, 3);
    ctx.fillRect(px + size - 3, py, 3, size);
  }

  function draw() {
    bctx.fillStyle = '#0A1150';
    bctx.fillRect(0, 0, boardCv.width, boardCv.height);
    bctx.strokeStyle = 'rgba(38,69,232,0.15)';
    bctx.lineWidth = 1;
    for (var c = 1; c < COLS; c++) {
      bctx.beginPath(); bctx.moveTo(c * CELL, 0); bctx.lineTo(c * CELL, boardCv.height); bctx.stroke();
    }
    for (var r = 0; r < ROWS; r++) {
      for (var c2 = 0; c2 < COLS; c2++) {
        if (grid[r][c2]) drawCell(bctx, c2, r, CELL, COLORS[grid[r][c2]]);
      }
    }
    if (clearing) {
      var flash = Math.floor(clearing.t / 60) % 2 === 0;
      bctx.fillStyle = flash ? '#D8E0FF' : '#2645E8';
      for (var i = 0; i < clearing.rows.length; i++) {
        bctx.fillRect(0, clearing.rows[i] * CELL, boardCv.width, CELL);
      }
    }
    if (cur && state === 'play' && !clearing) {
      var gy = ghostY();
      for (var i2 = 0; i2 < cur.cells.length; i2++) {
        var gx = cur.cells[i2][0] + cur.x, gyy = cur.cells[i2][1] + gy;
        if (gyy >= 0) drawCell(bctx, gx, gyy, CELL, COLORS[cur.type], true);
      }
      for (var i3 = 0; i3 < cur.cells.length; i3++) {
        var px = cur.cells[i3][0] + cur.x, py = cur.cells[i3][1] + cur.y;
        if (py >= 0) drawCell(bctx, px, py, CELL, COLORS[cur.type]);
      }
    }
    drawMini(nctx, nextCv, queue || []);
    drawMini(hctx, holdCv, hold ? [hold] : []);
    document.getElementById('score').textContent = score || 0;
    document.getElementById('top').textContent = topScore;
    document.getElementById('level').textContent = level || 1;
    document.getElementById('lines').textContent = lines || 0;
  }

  function drawMini(ctx, cv, types) {
    ctx.fillStyle = '#0A1150';
    ctx.fillRect(0, 0, cv.width, cv.height);
    var size = 14;
    for (var q = 0; q < types.length; q++) {
      var cells = SHAPES[types[q]];
      var minX = 9, maxX = 0, minY = 9, maxY = 0;
      for (var i = 0; i < cells.length; i++) {
        minX = Math.min(minX, cells[i][0]); maxX = Math.max(maxX, cells[i][0]);
        minY = Math.min(minY, cells[i][1]); maxY = Math.max(maxY, cells[i][1]);
      }
      var w = (maxX - minX + 1) * size, h = (maxY - minY + 1) * size;
      var ox = (cv.width - w) / 2, oy = q * 64 + (64 - h) / 2;
      for (var j = 0; j < cells.length; j++) {
        var x = ox + (cells[j][0] - minX) * size;
        var y = oy + (cells[j][1] - minY) * size;
        ctx.fillStyle = COLORS[types[q]];
        ctx.fillRect(x, y, size, size);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(x, y, size, 2);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(x, y + size - 2, size, 2);
      }
    }
  }

  var overlay = document.getElementById('overlay');
  function showOverlay(title, body, action) {
    document.getElementById('ovTitle').innerHTML = title;
    document.getElementById('ovBody').innerHTML = body;
    document.getElementById('ovAction').innerHTML = action;
    overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  function start() {
    if (state === 'play') return;
    if (state === 'pause') {
      state = 'play';
      hideOverlay();
      return;
    }
    reset();
    state = 'play';
    hideOverlay();
  }

  function togglePause() {
    if (state === 'play') {
      state = 'pause';
      showOverlay('PAUSED', '', 'PRESS P / TAP');
    } else if (state === 'pause') {
      state = 'play';
      hideOverlay();
    }
  }

  function loop(time) {
    var dt = time - lastTime;
    lastTime = time;
    if (state === 'play') {
      if (clearing) {
        clearing.t += dt;
        if (clearing.t > 240) finishClear();
      } else {
        dropTimer += dt;
        if (dropTimer > dropInterval) {
          dropTimer = 0;
          if (!collides(cur.cells, cur.x, cur.y + 1)) cur.y++;
          else lock();
        }
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', function (e) {
    if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].indexOf(e.key) > -1) e.preventDefault();
    if (state === 'title' || state === 'over') {
      if (e.key === 'Enter' || e.key === ' ') start();
      return;
    }
    if (e.key === 'p' || e.key === 'P') { togglePause(); return; }
    if (state !== 'play' || clearing) return;
    switch (e.key) {
      case 'ArrowLeft': move(-1); break;
      case 'ArrowRight': move(1); break;
      case 'ArrowDown': softDrop(); break;
      case 'ArrowUp': rotate(); break;
      case ' ': hardDrop(); break;
      case 'c': case 'C': doHold(); break;
    }
  });

  overlay.addEventListener('click', function () {
    if (state === 'pause') togglePause();
    else start();
  });

  function bindBtn(id, fn) {
    var el = document.getElementById(id);
    var fire = function (e) {
      e.preventDefault();
      if (state === 'title' || state === 'over') { start(); return; }
      if (state === 'play' && !clearing) fn();
    };
    el.addEventListener('touchstart', fire, { passive: false });
    el.addEventListener('mousedown', fire);
  }
  bindBtn('cLeft', function () { move(-1); });
  bindBtn('cRight', function () { move(1); });
  bindBtn('cDown', function () { softDrop(); });
  bindBtn('cRot', function () { rotate(); });
  bindBtn('cDrop', function () { hardDrop(); });
  bindBtn('cHold', function () { doHold(); });

  reset();
  state = 'title';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
