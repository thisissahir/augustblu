<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blu Blocks — August Blu</title>
  <meta name="description" content="A pixel block game in the August Blu universe.">
  <link rel="canonical" href="https://augustblu.com/play">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#060A33">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="August Blu">
  <meta property="og:title" content="Blu Blocks — August Blu">
  <meta property="og:description" content="A pixel block game in the August Blu universe.">
  <meta property="og:url" content="https://augustblu.com/play">
  <meta property="og:image" content="https://augustblu.com/assets/og-image.jpg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Blu Blocks — August Blu">
  <meta name="twitter:description" content="A pixel block game in the August Blu universe.">
  <meta name="twitter:image" content="https://augustblu.com/assets/og-image.jpg">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <style>
    :root{
      --royal:#0F1A72; --royal-deep:#0A1150; --royal-black:#060A33;
      --ice:#D8E0FF; --electric:#2645E8;
    }
    *{ margin:0; padding:0; box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      min-height:100%;
      display:flex; flex-direction:column;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(38,69,232,0.28), transparent 60%),
        var(--royal-black);
      color:var(--ice);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    /* ---- nav ---- */
    .nav{
      display:flex; align-items:center; justify-content:space-between;
      gap:16px; flex-wrap:wrap;
      padding:16px 22px;
      border-bottom:1px solid rgba(38,69,232,0.35);
    }
    .brand{
      color:var(--ice); text-decoration:none; font-weight:700;
      letter-spacing:2px; font-size:14px; white-space:nowrap;
    }
    .brand .star{ color:var(--electric); margin-right:6px; }
    .links{ display:flex; gap:6px; }
    .links a{
      color:var(--ice); text-decoration:none;
      font-size:12px; letter-spacing:1px; text-transform:uppercase;
      padding:7px 13px; border-radius:999px;
      border:1px solid rgba(216,224,255,0.22);
      opacity:0.8; transition:opacity .15s, border-color .15s, background .15s;
    }
    .links a:hover{ opacity:1; border-color:var(--electric); }
    .links a.current{
      opacity:1; background:var(--electric);
      border-color:var(--electric); color:#fff;
    }

    /* ---- game ---- */
    main{
      flex:1; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:14px; padding:28px 14px;
    }
    .page-title{
      font-size:clamp(22px,5vw,34px); letter-spacing:3px; font-weight:800;
      text-shadow:0 0 18px rgba(38,69,232,0.7);
    }
    .page-title span{ color:var(--electric); }
    .sub{ font-size:13px; opacity:0.6; text-align:center; max-width:34ch; }
    iframe{
      margin-top:6px;
      box-shadow:0 0 0 1px rgba(216,224,255,0.15), 0 24px 60px rgba(0,0,0,0.55);
      border-radius:8px; background:var(--royal-black);
    }

    /* ---- footer ---- */
    .foot{
      padding:16px 22px; text-align:center;
      font-size:11px; letter-spacing:1px; opacity:0.5;
      border-top:1px solid rgba(38,69,232,0.35);
    }
    .foot a{ color:var(--electric); text-decoration:none; }

    /* ---- music bar (the demos, rotating forever) ---- */
    .bb-music{
      display:flex; align-items:center; gap:10px;
      width:100%; max-width:640px; margin:0 auto 12px;
      padding:8px 12px;
      background:rgba(10,17,80,0.75);
      border:1px solid rgba(38,69,232,0.55);
      border-radius:6px;
    }
    .bb-music-btn,.bb-music-next{
      border:0; border-radius:4px; cursor:pointer; line-height:1;
      display:flex; align-items:center; justify-content:center;
      font-family:inherit;
    }
    .bb-music-btn{ background:var(--electric); color:#fff; width:30px; height:28px; font-size:12px; }
    .bb-music-next{ background:transparent; color:var(--ice); opacity:.65; width:26px; height:28px; font-size:13px; }
    .bb-music-next:hover{ opacity:1; }
    .bb-music-title{
      flex:1; min-width:0; font-size:13px; color:var(--ice);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .bb-music-eq{ display:flex; align-items:flex-end; gap:2px; height:14px; }
    .bb-music-eq i{ width:3px; height:4px; background:var(--electric); animation:bbEq .9s ease-in-out infinite; }
    .bb-music-eq i:nth-child(2){ animation-delay:.15s }
    .bb-music-eq i:nth-child(3){ animation-delay:.3s }
    @keyframes bbEq{ 0%,100%{height:3px} 50%{height:14px} }
    /* idle = autoplay was blocked; invite the click that starts it */
    .bb-music.idle .bb-music-eq i{ animation:none; height:3px; opacity:.35; }
    .bb-music.idle .bb-music-btn{ animation:bbPulse 1.8s ease-in-out infinite; }
    @keyframes bbPulse{
      0%,100%{ box-shadow:0 0 0 0 rgba(38,69,232,.75) }
      50%{ box-shadow:0 0 0 7px rgba(38,69,232,0) }
    }
    @media (prefers-reduced-motion:reduce){
      .bb-music-eq i,.bb-music.idle .bb-music-btn{ animation:none }
    }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/"><span class="star">✴</span>AUGUST BLU</a>
    <nav class="links">
      <a href="/">Home</a>
      <a href="/desktop">Desktop</a>
      <a class="current" href="/play" aria-current="page">Play</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">BLU<span>■</span>BLOCKS</h1>
    <p class="sub">A pixel block game in the August Blu universe.</p>
    <div class="bb-music idle" id="bbMusic">
      <button class="bb-music-btn" id="bbMusicBtn" aria-label="Play or pause the music">&#9654;</button>
      <span class="bb-music-eq" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="bb-music-title" id="bbMusicTitle">&#8212;</span>
      <button class="bb-music-next" id="bbMusicNext" aria-label="Next demo" title="Next demo">&#9197;</button>
    </div>
    <iframe src="/blu-blocks.html" title="Blu Blocks" style="border:0; width:100%; max-width:640px; height:720px; display:block; margin:0 auto;"></iframe>
  </main>

  <footer class="foot">
    © August Blu · <a href="/">augustblu.com</a>
  </footer>
  <script type="module" src="/src/js/playPage.js"></script>
</body>
</html>
