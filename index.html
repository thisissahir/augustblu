<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="August Blu">
  <meta property="og:description" content="collective consciousness, made tangible">
  <title>August Blu</title>
</head>
<body>

  <!-- WALLPAPER -->
  <div id="wallpaper">
    <div class="stars"></div>
    <div class="grid-floor"></div>
    <div class="bloom"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <img class="logo-fork" alt="August Blu" src="/assets/logo.png">
    <div id="particles"></div>
  </div>

  <!-- DESKTOP (icons injected by render.js) -->
  <div id="desktop"><div class="icon-grid" id="iconGrid"></div></div>

  <!-- WELCOME -->
  <div class="window raised open" id="welcome" data-win="welcome" style="z-index:3000">
    <div class="titlebar">
      <div class="title"><span class="ticon">✴️</span> Welcome to August Blu</div>
      <div class="tb-btns"><div class="tb-btn close" data-close="welcome">✕</div></div>
    </div>
    <div class="win-body">
      <div class="welcome-hero">
        <div class="big">AUGUST BLU</div>
        <div class="sub">collective consciousness, made tangible</div>
      </div>
      <div class="win-content" style="flex:none">
        <p>Double-click an icon to explore. <b>Demos</b>, <b>Gallery</b>, <b>Memories</b>, <b>Journal</b>, <b>Documents</b>.</p>
        <div class="btn-row"><button class="btn" data-close="welcome">Enter</button></div>
      </div>
    </div>
  </div>

  <!-- WINDOWS (injected by render.js) -->
  <div id="windows-root"></div>

  <!-- START MENU -->
  <div id="start-menu" class="raised">
    <div class="sm-sidebar">August&nbsp;Blu</div>
    <div class="sm-items" id="sm-items">
      <div class="sm-sep"></div>
      <div class="sm-item" data-open="welcome"><span class="smi">✴️</span> About August Blu</div>
      <div class="sm-item" id="sm-shutdown"><span class="smi">⏻</span> Shut Down...</div>
    </div>
  </div>

  <!-- TASKBAR -->
  <div id="taskbar" class="raised">
    <div id="start-btn" class="raised"><span class="logo">✴️</span> Start</div>
    <div class="tb-divider"></div>
    <div id="task-items"></div>
    <div id="tray" class="sunken"><span id="clock">12:00 AM</span></div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox">
    <div class="lb-close">✕</div>
    <img id="lb-img" src="" alt="">
  </div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
